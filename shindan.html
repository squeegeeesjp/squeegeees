<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>無料｜展示会ブース パフォーマンス診断｜スキージーズ株式会社</title>
  <meta name="description" content="展示会ブースを7つの視点で無料診断。名刺交換の数が伸びない理由、来場者の足が止まらない理由を、業界歴30年・施工400件以上のスキージーズがチェックします。" />

  <style>
    :root {
      --bg: #f7f4ef;
      --paper: #ffffff;
      --ink: #1f1f1f;
      --muted: #666666;
      --line: #ded8ce;
      --accent: #f3b13f;
      --accent-dark: #d58b12;
      --dark: #171717;
      --radius: 22px;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Yu Gothic", "YuGothic", "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.8;
      letter-spacing: 0.03em;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    a { color: inherit; text-decoration: none; }
    img { width: 100%; display: block; object-fit: cover; }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }

    .nav {
      height: 100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
    }

    .logo img {
      height: 72px;
      width: auto;
      object-fit: contain;
    }

    .back-link {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    section { padding: 70px 0; }

    .section-label {
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.18em;
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(30px, 4.4vw, 50px);
      line-height: 1.3;
      margin: 0 0 20px;
    }

    h2 {
      font-size: clamp(24px, 3.2vw, 34px);
      line-height: 1.35;
      margin: 0 0 16px;
    }

    .lead { color: var(--muted); font-size: 16px; margin: 0; }

    .diag-hero {
      padding: 80px 0 60px;
      text-align: center;
    }

    .diag-hero .badge {
      display: inline-block;
      background: var(--dark);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      padding: 8px 18px;
      border-radius: 999px;
      margin-bottom: 24px;
    }

    .diag-hero p.question {
      max-width: 640px;
      margin: 0 auto 36px;
      font-size: 17px;
      color: var(--ink);
    }

    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 54px;
      padding: 0 30px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 14px;
      transition: 0.2s ease;
    }

    .button.primary { background: var(--dark); color: #fff; }
    .button.secondary { background: #fff; border: 1px solid var(--line); color: var(--ink); }
    .button:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

    .axis-section {
      background: var(--paper);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .axis-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 36px;
    }

    .axis-card {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 26px 20px;
      position: relative;
    }

    .axis-card .num {
      font-size: 20px;
      font-weight: 900;
      color: var(--accent-dark);
      margin-bottom: 10px;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .axis-card .step {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .axis-card .keyword {
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .axis-card.secret {
      background: var(--dark);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .axis-card.secret .num { color: var(--accent); }
    .axis-card.secret .step { font-size: 15px; line-height: 1.6; }

    .secret-callout {
      margin-top: 40px;
      background: var(--dark);
      color: #fff;
      border-radius: var(--radius);
      padding: 40px 36px;
      text-align: center;
    }

    .secret-callout .section-label { color: var(--accent); }
    .secret-callout p { color: rgba(255,255,255,0.78); max-width: 600px; margin: 0 auto; line-break: strict; word-break: keep-all; overflow-wrap: break-word; }
    .secret-callout h3 { font-size: 20px; margin: 10px 0 16px; }

    .flow-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      margin-top: 36px;
    }

    .flow-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 30px 26px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.04);
    }

    .flow-card .flow-num {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--dark);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .flow-card h4 {
      font-size: 18px;
      margin: 0 0 12px;
    }

    .flow-card p {
      color: var(--ink);
      opacity: 0.75;
      font-size: 15px;
      margin: 0;
    }

    .send-items {
      margin-top: 40px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 32px;
    }

    .send-items h4 {
      font-size: 18px;
      margin: 0 0 18px;
    }

    .send-items ul {
      margin: 0;
      padding-left: 22px;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.9;
    }

    .send-items li { margin-bottom: 10px; }

    .contact-section {
      background: var(--paper);
      border-top: 1px solid var(--line);
    }

    .contact-card {
      background: var(--dark);
      color: #fff;
      border-radius: 34px;
      padding: 56px 40px;
      box-shadow: var(--shadow);
    }

    .contact-card p { color: rgba(255,255,255,0.72); margin-bottom: 28px; }

    .form-grid {
      display: grid;
      gap: 16px;
      max-width: 640px;
      margin: 0 auto;
      text-align: left;
    }

    .form-row label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      color: rgba(255,255,255,0.85);
    }

    .form-row input,
    .form-row select,
    .form-row textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 14px;
      font-family: inherit;
    }

    .form-row textarea { min-height: 110px; resize: vertical; }

    .form-row input::placeholder,
    .form-row textarea::placeholder { color: rgba(255,255,255,0.4); }

    .form-submit {
      margin-top: 8px;
      text-align: center;
    }

    .form-note {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      text-align: center;
      margin-top: 16px;
    }

    footer {
      padding: 34px 0;
      background: var(--bg);
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
    }

    .footer-inner {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }
